name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm run check:architecture
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path pwcli/Cargo.toml -- --check
      - run: cargo test --manifest-path pwcli/Cargo.toml
