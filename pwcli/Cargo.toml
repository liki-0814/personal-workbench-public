[package]
name = "pwcli"
version = "0.1.8"
edition = "2021"
description = "Personal Workbench CLI"
license = "AGPL-3.0-only"

[features]
default = ["embeddings"]
embeddings = ["dep:fastembed"]
mock-acp = []

[[bin]]
name = "pwcli"
path = "src/main.rs"

[[bin]]
name = "pwcli-mock-acp"
path = "tests/support/mock_acp.rs"
required-features = ["mock-acp"]
test = false

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "socks", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
futures = "0.3"
serde_json = "1.0"
anyhow = "1.0"
dirs = "6.0"
async-trait = "0.1"
rand = "0.8"
base64 = "0.22"
terminal_size = "0.4"
axum = { version = "0.8", features = ["multipart", "tokio", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
regex = "1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
similar = "2"
tokio-util = { version = "0.7", features = ["rt", "compat"] }
agent-client-protocol = { version = "0.11.1", features = ["unstable"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
fs2 = "0.4"
russh = { version = "0.61", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
russh-sftp = "2.1"
shellexpand = "3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
fastembed = { version = "5.16", optional = true, default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
jsonschema = { version = "0.47.0", default-features = false }
quick-js = "0.4.1"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
libc = "0.2"
csv = "1.3"
tempfile = "3.27.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"

[dev-dependencies]
mockito = "1.7"
http-body-util = "0.1"
bytes = "1"

[build-dependencies]
chrono = "0.4"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
